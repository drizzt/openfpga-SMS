name: Upstream PR

# Builds the Copybara sync PR (vendor/upstream-sync) and gates it on timing:
# any path with negative slack posts the timing report as a PR comment and fails
# the check (red), so a timing-broken sync cannot be approved. On approval,
# release-on-approval.yml auto-merges and cuts a release.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Only the automated upstream-sync PR; ordinary PRs are built by build-branch.
    if: github.head_ref == 'vendor/upstream-sync'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build chip32
        run: scripts/build_chip32.sh

      - name: Check package consistency
        run: scripts/check_packages.sh

      - name: Compile
        run: docker run --rm -v ${{ github.workspace }}:/build -w /build raetro/quartus:21.1 quartus_sh -t generate.tcl

      - name: Reverse bitstream
        run: scripts/deploy_bitstream.sh

      - name: Package test zips
        id: pkg
        run: |
          set -- pkg/Cores/*/core.json
          VERSION=$(jq -r '.core.metadata.version' "$1")
          INFIX="pr${{ github.event.pull_request.number }}"
          scripts/package_release.sh "$VERSION" "$INFIX"
          echo "infix=${INFIX}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Upload test zips
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: package-${{ steps.pkg.outputs.infix }}
          path: openfpga-*_${{ steps.pkg.outputs.infix }}_${{ steps.pkg.outputs.version }}.zip

      - name: Extract timing closure failures
        if: always()
        run: scripts/extract_timing_failures.sh projects/output_files/ap_core.sta.summary timing.txt

      - name: Upload timing report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: timing
          path: timing.txt

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            projects/output_files/ap_core.rbf
            projects/output_files/ap_core.fit.summary
            projects/output_files/ap_core.sta.summary
            projects/output_files/ap_core.sta.rpt
            projects/output_files/ap_core.flow.rpt
            build_output/reports/

      - name: Gate on timing
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # extract_timing_failures.sh writes exactly this line when timing is clean.
          if grep -qx "No timing closure failures." timing.txt; then
            echo "Timing clean, no negative slack."
            exit 0
          fi
          {
            echo "### Timing check failed: negative slack"
            echo ""
            echo '```'
            cat timing.txt
            echo '```'
          } > comment.md
          gh pr comment "$PR" --body-file comment.md
          echo "::error::Negative slack found; blocking the sync PR." >&2
          exit 1
