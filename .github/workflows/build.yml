name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Build chip32
        run: scripts/build_chip32.sh

      - name: Check package consistency
        run: scripts/check_packages.sh

      - name: Bump version
        id: version
        run: |
          NEW=$(scripts/bump_version.sh "${{ inputs.bump }}")
          echo "version=$NEW" >> "$GITHUB_OUTPUT"

      - name: Compile
        run: docker run --rm -v ${{ github.workspace }}:/build -w /build raetro/quartus:21.1 quartus_sh -t generate.tcl

      - name: Reverse bitstream
        run: scripts/deploy_bitstream.sh

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pkg/Cores/*/core.json gateware.json
          git commit -m "release v${{ steps.version.outputs.version }}"
          git tag "v${{ steps.version.outputs.version }}"
          git push origin HEAD --tags

      - name: Package release zips
        run: scripts/package_release.sh "${{ steps.version.outputs.version }}"

      - name: Create GitHub release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          files: openfpga-*_${{ steps.version.outputs.version }}.zip
          generate_release_notes: true

      - name: Extract timing closure failures
        if: always()
        run: scripts/extract_timing_failures.sh projects/output_files/ap_core.sta.summary timing.txt

      - name: Upload timing report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: timing
          path: timing.txt

      - name: Check custom STA reports
        if: always()
        run: |
          echo "=== Custom STA reports ==="
          ls -la build_output/reports/ 2>/dev/null || echo "No custom STA reports directory found"
          echo "=== Output files ==="
          ls -la projects/output_files/*.rpt projects/output_files/*.summary 2>/dev/null || true

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reports
          path: |
            projects/output_files/ap_core.fit.summary
            projects/output_files/ap_core.fit.rpt
            projects/output_files/ap_core.sta.summary
            projects/output_files/ap_core.sta.rpt
            projects/output_files/ap_core.flow.rpt
            build_output/reports/
