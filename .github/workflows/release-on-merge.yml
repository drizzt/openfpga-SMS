name: Release on Merge

# When the Copybara sync PR (vendor/upstream-sync) is merged into master, cut a
# release: version bump, compile, tag, GitHub release and the three per-platform
# zips, then delete the merged branch. Fires however the PR is merged (the Merge
# button or an auto-merge), so there is no "approve but do not merge" trap.
#
# Bump type comes from PR labels (release:major / release:minor, otherwise patch),
# so add the label before merging. The timing gate (upstream-pr.yml) should be a
# required status check on master so a red PR cannot be merged in the first place.

on:
  pull_request:
    types: [closed]
    branches: [master]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.ref == 'vendor/upstream-sync'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Resolve bump from PR labels
        id: bump
        env:
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          if echo "$LABELS" | grep -q 'release:major'; then
            BUMP=major
          elif echo "$LABELS" | grep -q 'release:minor'; then
            BUMP=minor
          else
            BUMP=patch
          fi
          echo "bump=$BUMP" >> "$GITHUB_OUTPUT"
          echo "Bump type: $BUMP"

      - name: Checkout master
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: master
          fetch-depth: 0
          # Admin PAT: bypasses the required "gate" check on master (gate runs
          # only on pull_request, so the default GITHUB_TOKEN push is rejected).
          token: ${{ secrets.CUSTOM_GH_TOKEN }}

      - name: Build chip32
        run: scripts/build_chip32.sh

      - name: Check package consistency
        run: scripts/check_packages.sh

      - name: Bump version
        id: version
        run: |
          NEW=$(scripts/bump_version.sh "${{ steps.bump.outputs.bump }}")
          echo "version=$NEW" >> "$GITHUB_OUTPUT"

      - name: Compile
        run: docker run --rm -v ${{ github.workspace }}:/build -w /build raetro/quartus:21.1 quartus_sh -t generate.tcl

      - name: Reverse bitstream
        run: scripts/deploy_bitstream.sh

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pkg/Cores/*/core.json gateware.json
          git commit -m "release v${{ steps.version.outputs.version }}"
          git tag "v${{ steps.version.outputs.version }}"
          git push origin HEAD:master --tags

      - name: Package release zips
        run: scripts/package_release.sh "${{ steps.version.outputs.version }}"

      - name: Create GitHub release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          files: openfpga-*_${{ steps.version.outputs.version }}.zip
          generate_release_notes: true

      - name: Delete merged sync branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X DELETE \
            "repos/${{ github.repository }}/git/refs/heads/vendor/upstream-sync" \
            2>/dev/null && echo "branch deleted" || echo "branch already gone"

      - name: Extract timing closure failures
        if: always()
        run: scripts/extract_timing_failures.sh projects/output_files/ap_core.sta.summary timing.txt

      - name: Upload timing report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: timing
          path: timing.txt

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reports
          path: |
            projects/output_files/ap_core.fit.summary
            projects/output_files/ap_core.fit.rpt
            projects/output_files/ap_core.sta.summary
            projects/output_files/ap_core.sta.rpt
            projects/output_files/ap_core.flow.rpt
            build_output/reports/
