name: Release on Approval

# When the maintainer approves the Copybara sync PR (vendor/upstream-sync), merge
# it into master and cut a release: version bump, compile, tag, GitHub release and
# the three per-platform zips. Bump type comes from PR labels (release:major /
# release:minor, otherwise patch). Human-review-triggered runs are not recursion-
# suppressed, so the default GITHUB_TOKEN is enough.

on:
  pull_request_review:
    types: [submitted]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event.review.state == 'approved' &&
      github.event.pull_request.head.ref == 'vendor/upstream-sync'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Resolve bump from PR labels
        id: bump
        env:
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          if echo "$LABELS" | grep -q 'release:major'; then
            BUMP=major
          elif echo "$LABELS" | grep -q 'release:minor'; then
            BUMP=minor
          else
            BUMP=patch
          fi
          echo "bump=$BUMP" >> "$GITHUB_OUTPUT"
          echo "Bump type: $BUMP"

      - name: Checkout master
        uses: actions/checkout@v6
        with:
          ref: master
          fetch-depth: 0

      - name: Merge the sync PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          gh pr merge "${{ github.event.pull_request.number }}" --merge
          git pull --ff-only origin master

      - name: Build chip32
        run: scripts/build_chip32.sh

      - name: Check package consistency
        run: scripts/check_packages.sh

      - name: Bump version
        id: version
        run: |
          NEW=$(scripts/bump_version.sh "${{ steps.bump.outputs.bump }}")
          echo "version=$NEW" >> "$GITHUB_OUTPUT"

      - name: Compile
        run: docker run --rm -v ${{ github.workspace }}:/build -w /build raetro/quartus:21.1 quartus_sh -t generate.tcl

      - name: Reverse bitstream
        run: scripts/deploy_bitstream.sh

      - name: Commit version bump
        run: |
          git add pkg/Cores/*/core.json gateware.json
          git commit -m "release v${{ steps.version.outputs.version }}"
          git tag "v${{ steps.version.outputs.version }}"
          git push origin HEAD:master --tags

      - name: Package release zips
        run: scripts/package_release.sh "${{ steps.version.outputs.version }}"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          files: openfpga-*_${{ steps.version.outputs.version }}.zip
          generate_release_notes: true

      - name: Extract timing closure failures
        if: always()
        run: scripts/extract_timing_failures.sh projects/output_files/ap_core.sta.summary timing.txt

      - name: Upload timing report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: timing
          path: timing.txt

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            projects/output_files/ap_core.fit.summary
            projects/output_files/ap_core.fit.rpt
            projects/output_files/ap_core.sta.summary
            projects/output_files/ap_core.sta.rpt
            projects/output_files/ap_core.flow.rpt
            build_output/reports/
