name: Build

on:
  workflow_dispatch:   # manual branch build only

# PRs are built + timing-gated by upstream-pr.yml; master by release-on-merge.yml.
# This workflow stays for on-demand builds of a branch without an open PR.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Build chip32
        run: scripts/build_chip32.sh

      - name: Check package consistency
        run: scripts/check_packages.sh

      - name: Compile
        run: docker run --rm -v ${{ github.workspace }}:/build -w /build raetro/quartus:21.1 quartus_sh -t generate.tcl

      - name: Reverse bitstream
        run: scripts/deploy_bitstream.sh

      - name: Package build zips
        run: |
          set -- pkg/Cores/*/core.json
          VERSION=$(jq -r '.core.metadata.version' "$1")
          SAFE_BRANCH=$(printf '%s' "$GITHUB_REF_NAME" | sed 's#[^A-Za-z0-9._-]#-#g')
          scripts/package_release.sh "$VERSION" "$SAFE_BRANCH"
          echo "PACKAGE_BRANCH=${SAFE_BRANCH}" >> "$GITHUB_ENV"
          echo "PACKAGE_VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Upload package zips
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-${{ env.PACKAGE_BRANCH }}
          path: openfpga-*_${{ env.PACKAGE_BRANCH }}_${{ env.PACKAGE_VERSION }}.zip

      - name: Extract timing closure failures
        if: always()
        run: scripts/extract_timing_failures.sh projects/output_files/ap_core.sta.summary timing.txt

      - name: Upload timing report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: timing
          path: timing.txt

      - name: Check custom STA reports
        if: always()
        run: |
          echo "=== Custom STA reports ==="
          ls -la build_output/reports/ 2>/dev/null || echo "No custom STA reports directory found"
          echo "=== Output files ==="
          ls -la projects/output_files/*.rpt projects/output_files/*.summary 2>/dev/null || true

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reports
          path: |
            projects/output_files/ap_core.fit.summary
            projects/output_files/ap_core.fit.rpt
            projects/output_files/ap_core.sta.summary
            projects/output_files/ap_core.sta.rpt
            projects/output_files/ap_core.flow.rpt
            build_output/reports/
